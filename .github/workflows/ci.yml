name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: Run tests
      run: |
        pytest tests/ -v
    - name: Run research report test
      run: |
        pytest tests/test_run_pipeline.py::TestRunPipeline::test_research_report_generation -v
    - name: Run performance benchmarks
      run: |
        pytest tests/test_run_pipeline.py::TestPerformanceAndStress tests/test_run_pipeline.py::test_pipeline_scales_to_1000_candidates -v

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v


  pipeline:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run pipeline
      run: python run_pipeline.py
    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated pipeline update"
        git push
