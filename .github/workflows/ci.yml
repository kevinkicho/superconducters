name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest mypy flake8 pytest-cov
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=run_pipeline.py --cov=dft_calculator.py --cov=scripts/arxiv_scraper.py --cov-fail-under=100
    - name: Run research report test
      run: |
        pytest tests/test_run_pipeline.py::TestRunPipeline::test_research_report_generation -v
    - name: Run performance benchmarks
      run: |
        pytest tests/test_run_pipeline.py::TestPerformanceAndStress tests/test_run_pipeline.py::test_pipeline_scales_to_1000_candidates -v

    - name: Run performance benchmark (100k candidates)
      run: |
        pytest tests/test_run_pipeline.py::test_pipeline_scales_to_100000_candidates -v

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v
    - name: Run pipeline integration test (mocked APIs)
      run: |
        pytest tests/test_run_pipeline.py::TestRunPipeline::test_pipeline_integration_mocked_apis -v
    - name: Run end-to-end tests
      run: |
        pytest tests/e2e/ -v
    - name: Run mypy type checking
      run: |
        mypy run_pipeline.py dft_calculator.py scripts/arxiv_scraper.py
    - name: Run flake8 linting
      run: |
        flake8 run_pipeline.py dft_calculator.py scripts/arxiv_scraper.py
    - name: Run stress tests
      run: |
        pytest tests/ -m stress -v

    - name: Run stress test (simultaneous API failures)
      run: |
        pytest tests/test_run_pipeline.py::test_simultaneous_api_failures -v


  pipeline:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run pipeline
      run: python run_pipeline.py
    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated pipeline update"
        git push

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ github.repository }}:latest
    - name: Log in to Heroku Container Registry
      uses: docker/login-action@v2
      with:
        registry: registry.heroku.com
        username: _
        password: ${{ secrets.HEROKU_API_KEY }}
    - name: Tag and push Docker image to Heroku
      run: |
        docker tag ${{ github.repository }}:latest registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
        docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
    - name: Release Heroku container
      uses: heroku/heroku-release-action@v1
      with:
        app: ${{ secrets.HEROKU_APP_NAME }}
        image: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
    - name: Update README with deployed URL
      run: |
        DEPLOYED_URL="https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"
        if grep -q "Deployed URL:" README.md; then
          sed -i "s|^Deployed URL:.*|Deployed URL: $DEPLOYED_URL|" README.md
        else
          echo "Deployed URL: $DEPLOYED_URL" >> README.md
        fi
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add README.md
        git diff --quiet && git diff --staged --quiet || git commit -m "Update deployed URL"
        git push
