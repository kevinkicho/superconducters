name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[api,dev]"
      - run: ruff check superconductors app.py run_pipeline.py streamlit_dashboard.py scripts/api_client.py scripts/arxiv_scraper.py scripts/generate_candidates.py scripts/generate_changelog.py scripts/generate_report.py scripts/predict_tc.py scripts/query_database.py tests/test_api_client.py tests/test_api_endpoints.py tests/test_arxiv_scraper.py tests/test_changelog.py tests/test_dashboard.py tests/test_generate_candidates.py tests/test_generate_report.py tests/test_predict_tc.py tests/test_query_database.py tests/test_repository.py tests/test_run_pipeline.py
      - run: pytest --cov --cov-report=term-missing
