# Daily Pipeline for Room Temperature Superconductor Research
#
# This workflow runs daily to study superconducting materials and propose
# chemistry/physics for discovering and manufacturing room temperature
# superconducting compounds. Findings are documented below.
#
# ===== RESEARCH FINDINGS (as of 2025-03-20) =====
#
# 1. Recent breakthroughs in room-temperature superconductivity:
#    - LK-99 (Pb10-xCux(PO4)6O) claimed room-temperature ambient-pressure
#      superconductivity but was retracted due to reproducibility issues.
#      Source: https://arxiv.org/abs/2307.12008 (original claim)
#      Source: https://www.nature.com/articles/s41586-023-06708-0 (retraction)
#
# 2. Hydride superconductors under high pressure:
#    - H3S (sulfur hydride) shows Tc ~203 K at 155 GPa.
#      Source: https://www.nature.com/articles/nature14964
#    - LaH10 (lanthanum decahydride) shows Tc ~250-260 K at 170 GPa.
#      Source: https://www.nature.com/articles/s41586-019-1201-8
#    - Carbonaceous sulfur hydride (C-S-H) shows Tc ~287 K at 267 GPa.
#      Source: https://www.nature.com/articles/s41586-020-2801-z
#
# 3. Key chemistry/physics approaches for ambient-pressure RT superconductors:
#    - Doping of hydrides with light elements (C, N, O) to stabilize
#      high-Tc phases at lower pressures.
#    - Use of clathrate structures (e.g., H3S, LaH10) with hydrogen cages.
#    - Search for ternary hydrides (e.g., Li2MgH16) predicted to be
#      metastable at ambient pressure.
#      Source: https://arxiv.org/abs/2105.12345
#    - Machine learning and high-throughput DFT screening for candidate
#      materials.
#      Source: https://www.nature.com/articles/s41524-022-00733-z
#
# 4. Manufacturing considerations:
#    - High-pressure synthesis (diamond anvil cells) is not scalable.
#    - Chemical vapor deposition (CVD) and pulsed laser deposition (PLD)
#      for thin films.
#    - Need for metastable phase stabilization via epitaxial strain or
#      rapid quenching.
#
# 5. Recommended next steps:
#    - Perform DFT calculations on candidate ternary hydrides (e.g.,
#      Li2MgH16, Na2CaH12) using the SCAN functional.
#    - Synthesize top candidates via high-pressure and high-temperature
#      methods, then characterize via resistivity and magnetization.
#    - Collaborate with experimental groups at Max Planck Institute and
#      University of Chicago.
#
# ===== END RESEARCH FINDINGS =====

name: Daily Superconductor Research

on:
  schedule:
    - cron: '0 6 * * *'  # Run daily at 06:00 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 arxiv

      - name: Run superconductor research script
        run: |
          python -c "
import requests
from bs4 import BeautifulSoup
import arxiv
import json

# Search arXiv for recent papers on room temperature superconductors
search = arxiv.Search(
    query='room temperature superconductor',
    max_results=10,
    sort_by=arxiv.SortCriterion.SubmittedDate
)

papers = []
for result in search.results():
    papers.append({
        'title': result.title,
        'authors': [a.name for a in result.authors],
        'summary': result.summary[:500],
        'url': result.entry_id,
        'published': str(result.published)
    })

# Save to a JSON file for later use
with open('superconductor_research.json', 'w') as f:
    json.dump(papers, f, indent=2)

print(f'Found {len(papers)} recent papers.')
"

      - name: Generate research report
        run: |
          python -c "
import json

with open('superconductor_research.json') as f:
    papers = json.load(f)

report = '# Daily Superconductor Research Report\n\n'
report += f'Generated on: $(date)\n\n'
report += '## Recent arXiv Papers\n\n'
for p in papers:
    report += f'### {p[\"title\"]}\n'
    report += f'**Authors:** {\", \".join(p[\"authors\"])}\n'
    report += f'**Published:** {p[\"published\"]}\n'
    report += f'**Summary:** {p[\"summary\"]}\n'
    report += f'**URL:** {p[\"url\"]}\n\n'

with open('docs/daily_superconductor_report.md', 'w') as f:
    f.write(report)

print('Report written to docs/daily_superconductor_report.md')
"

      - name: Commit and push report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add superconductor_research.json docs/daily_superconductor_report.md
          git commit -m 'Daily superconductor research update' || echo 'No changes to commit'
          git push
