[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "superconductors"
version = "1.0.0"
description = "Candidate screening and research tools for superconductor discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.100,<0.120",
  "httpx>=0.24,<1",
  "pydantic>=2,<3",
  "starlette>=0.27,<0.48",
  "uvicorn>=0.22,<1",
]
ui = [
  "pandas>=2,<3",
  "plotly>=5.15,<6",
  "streamlit>=1.25,<2",
]
ml = [
  "torch>=2,<3",
]
analysis = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.2,<2",
]
dft = [
  "mp-api>=0.33,<1",
]
reports = [
  "reportlab>=4,<5",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
superconductors = "superconductors.cli:main"

[tool.setuptools.packages.find]
include = ["superconductors*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["changelog", "docs/_site", "docs/tutorial.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["superconductors"]
branch = true
omit = ["superconductors/dft/ml.py", "superconductors/multifidelity.py"]

[tool.coverage.report]
fail_under = 80
