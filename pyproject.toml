[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "superconductors"
version = "1.0.0"
description = "Candidate screening and research tools for superconductor discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.100,<0.120",
  "httpx>=0.24,<1",
  "pydantic>=2,<3",
  "starlette>=0.27,<0.48",
  "uvicorn>=0.22,<1",
]
ui = [
  "apscheduler>=3.10,<4",
  "pandas>=2,<3",
  "plotly>=5.15,<6",
  "requests>=2.31,<3",
  "streamlit>=1.25,<2",
  "websockets>=11,<16",
]
ml = [
  "joblib>=1.2,<3",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scikit-learn>=1.2,<2",
  "scikit-optimize>=0.9,<1",
  "scipy>=1.10,<2",
  "shap>=0.41,<1",
  "torch>=2,<3",
  "torch-geometric>=2.3,<3",
]
dft = [
  "ase>=3.22,<4",
  "mp-api>=0.33,<1",
  "pymatgen>=2023",
]
integrations = [
  "aiohttp>=3.8,<4",
  "cryptography>=41,<50",
  "paho-mqtt>=1.6,<3",
  "prometheus-client>=0.17,<1",
  "pyvisa>=1.13,<2",
  "requests>=2.31,<3",
  "schedule>=1.2,<2",
]
reports = [
  "matplotlib>=3.7,<4",
  "reportlab>=4,<5",
  "weasyprint>=60,<70",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
superconductors = "superconductors.cli:main"

[tool.setuptools.packages.find]
include = ["superconductors*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
  "tests/test_run_pipeline.py",
  "tests/test_repository.py",
  "tests/test_api_endpoints.py",
  "tests/test_predict_tc.py",
  "tests/test_query_database.py",
  "tests/test_generate_candidates.py",
  "tests/test_generate_report.py",
  "tests/test_dashboard.py",
  "tests/test_arxiv_scraper.py",
  "tests/test_api_client.py",
  "tests/test_changelog.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["changelog", "docs/_site"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["superconductors"]
branch = true
